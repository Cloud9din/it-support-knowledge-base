<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Support Knowledge Base</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <h1>IT Support Knowledge Base</h1>
      <p>Quick troubleshooting guides for common IT issues</p>

      <input
        type="text"
        id="searchInput"
        placeholder="Search troubleshooting guides..."
        aria-label="Search troubleshooting guides"
      >
    </div>
  </header>

  <main class="container">

    <section class="categories">

      <article class="card">
        <h2>💻 Windows</h2>
        <ul>
          <li>
            <button class="guide-btn" data-guide="slow-computer">
              Slow computer
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="windows-update">
              Windows update issues
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="app-not-responding">
              Application not responding
            </button>
          </li>
        </ul>
      </article>

      <article class="card">
        <h2>📧 Microsoft 365</h2>
        <ul>
          <li>
            <button class="guide-btn" data-guide="outlook-not-opening">
              Outlook not opening
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="cannot-send-email">
              Cannot send email
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="teams-sign-in">
              Teams sign-in problem
            </button>
          </li>
        </ul>
      </article>

      <article class="card">
        <h2>🌐 Network</h2>
        <ul>
          <li>
            <button class="guide-btn" data-guide="no-internet">
              No internet connection
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="wifi-disconnecting">
              Wi-Fi disconnecting
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="ip-troubleshooting">
              IP address troubleshooting
            </button>
          </li>
        </ul>
      </article>

      <article class="card">
        <h2>🖨️ Printers</h2>
        <ul>
          <li>
            <button class="guide-btn" data-guide="printer-offline">
              Printer offline
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="print-queue">
              Print queue stuck
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="printer-not-detected">
              Printer not detected
            </button>
          </li>
        </ul>
      </article>

      <article class="card">
        <h2>👤 User Accounts</h2>
        <ul>
          <li>
            <button class="guide-btn" data-guide="password-reset">
              Password reset
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="account-locked">
              Account locked
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="sign-in">
              Unable to sign in
            </button>
          </li>
        </ul>
      </article>

      <article class="card">
        <h2>🖥️ Hardware</h2>
        <ul>
          <li>
            <button class="guide-btn" data-guide="keyboard-not-working">
              Keyboard not working
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="monitor-not-detected">
              Monitor not detected
            </button>
          </li>
          <li>
            <button class="guide-btn" data-guide="usb-not-recognised">
              USB device not recognised
            </button>
          </li>
        </ul>
      </article>

    </section>

    <section id="guidePanel" class="guide-panel hidden">
      <button id="closeGuide" type="button">Close</button>
      <div id="guideContent"></div>
    </section>

  </main>

  <footer>
    <p>Built with HTML, CSS and JavaScript</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
